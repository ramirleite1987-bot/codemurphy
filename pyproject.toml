[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "codemurphy"
version = "0.1.0"
description = "Evidence-based, multi-model code review and benchmarking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/ramirleite1987-bot/codemurphy"

[project.scripts]
codemurphy = "codemurphy.cli:main"

[tool.setuptools.packages.find]
include = ["codemurphy*"]
