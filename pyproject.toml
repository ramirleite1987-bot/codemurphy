[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "codemurphy"
version = "0.4.1"
description = "Evidence-based, multi-model code review and benchmarking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dependency-audit = ["ruamel.yaml==0.18.17"]

[project.urls]
Repository = "https://github.com/ramirleite1987-bot/codemurphy"

[project.scripts]
codemurphy = "codemurphy.cli:main"

[tool.setuptools.packages.find]
include = ["codemurphy*"]

[tool.setuptools.package-data]
codemurphy = ["socket_client.mjs"]
