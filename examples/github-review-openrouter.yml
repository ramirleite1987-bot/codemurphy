name: CodeMurphy OpenRouter pilot
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: codemurphy-openrouter-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  review:
    if: >-
      vars.CODEMURPHY_OPENROUTER == 'true' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Replace the version tag with its verified full commit SHA in production.
      - uses: ramirleite1987-bot/codemurphy@v0.3.1
        with:
          trusted-base: main
          config-path: .codemurphy.openrouter.json
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          mode: primary
          publish: 'false'
